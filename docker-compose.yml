services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: QuintoCiclo2026-1
      POSTGRES_DB: ventaentradas
    ports:
       - "5432:5432"
    volumes:
       - postgres_data:/var/lib/postgresql/data     
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ventaentradas"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:QuintoCiclo2026-1@db:5432/ventaentradas
    depends_on:
       db:
          condition: service_healthy
    env_file:
      - .env
 
volumes:
  postgres_data: